version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # pytest-homeassistant-custom-component pins pytest exactly (currently
      # pytest==9.0.3). Bumping the pytest floor past that pin makes the
      # install unresolvable and fails CI, so pytest is upgraded only as a
      # side effect of upgrading pytest-homeassistant-custom-component.
      - dependency-name: pytest

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(ci)"
    # Always update third-party actions; Dependabot will bump SHAs + refresh tag comments.
    groups:
      actions:
        patterns:
          - "*"
